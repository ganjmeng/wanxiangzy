version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - next
          - "@next/*"
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - "@testing-library/*"
          - jsdom
      tooling:
        patterns:
          - eslint
          - "@typescript-eslint/*"
          - typescript
          - tailwindcss
          - postcss
          - autoprefixer

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
