name: Feature request
description: Propose a scoped product, engineering, documentation, or operations improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Operational impact
      description: Note effects on schemas, queues, providers, billing, security, storage, deployment, or backwards compatibility.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should maintainers know the request is complete?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: This request does not disclose a security vulnerability.
          required: true
