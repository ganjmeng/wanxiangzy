name: Deploy AWS manually

on:
  workflow_dispatch:

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Normalize SSH target
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_PORT: ${{ secrets.AWS_PORT }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail
          clean() {
            printf '%s' "$1" | tr -d '\r\n[:space:]'
          }

          HOST="$(clean "${AWS_HOST:-}")"
          USER="$(clean "${AWS_USER:-ec2-user}")"
          PORT="$(clean "${AWS_PORT:-22}")"

          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"

          if [[ "$HOST" == *@* ]]; then
            USER="${HOST%@*}"
            HOST="${HOST#*@}"
          fi

          if [[ -z "$HOST" ]]; then
            echo "::error::AWS_HOST is empty"
            exit 1
          fi

          if [[ ! "$USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]; then
            echo "::error::AWS_USER contains invalid characters after normalization"
            exit 1
          fi

          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::AWS_PORT must be a number"
            exit 1
          fi

          {
            echo "AWS_HOST_NORM=$HOST"
            echo "AWS_USER_NORM=$USER"
            echo "AWS_PORT_NORM=$PORT"
          } >> "$GITHUB_ENV"

          echo "SSH target: $USER@$HOST:$PORT"

      - name: Configure SSH
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::AWS_SSH_PRIVATE_KEY is empty"
            exit 1
          fi
          if [[ -z "${AWS_SSH_KNOWN_HOSTS:-}" ]]; then
            echo "::error::AWS_SSH_KNOWN_HOSTS is empty; production deploys require a pinned EC2 host key"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aws_deploy_key
          chmod 600 ~/.ssh/aws_deploy_key
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/known_hosts >/dev/null

      - name: Fetch .env.production from EC2
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
        run: |
          set -euo pipefail

          APP_DIR="${AWS_APP_DIR:-~/apps/wanxiangzy}"
          if [[ "$APP_DIR" == *$'\n'* || "$APP_DIR" == *$'\r'* || "$APP_DIR" == *".."* ]]; then
            echo "::error::AWS_APP_DIR contains an unsafe path"
            exit 1
          fi
          if [[ ! "$APP_DIR" =~ ^[A-Za-z0-9_./~-]+$ ]]; then
            echo "::error::AWS_APP_DIR contains unsupported characters"
            exit 1
          fi

          REMOTE_ENV_FILE="${APP_DIR%/}/shared/.env.production"
          echo "Fetching production environment from the configured EC2 application directory..."

          scp -P "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=60 \
            "$AWS_USER_NORM@$AWS_HOST_NORM:$REMOTE_ENV_FILE" .env.production

          echo "File: $(wc -c < .env.production) bytes, $(wc -l < .env.production) lines"

          # Verify required keys exist (Next.js auto-loads .env.production at build time)
          missing=0
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_APP_URL; do
            if grep -Eq "^${key}=.+$" .env.production; then
              echo "  ✓ $key"
            else
              echo "::error::Missing or empty required key in .env.production: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          env_value() {
            local key="$1"
            sed -n "s/^${key}=//p" .env.production | tail -n 1 | tr -d '\r'
          }

          AI_TOOLS_MODE="$(env_value AI_TOOLS_EXECUTION_MODE)"
          AI_TOOLS_OPERATIONS="$(env_value AI_TOOLS_PROVIDER_OPERATIONS)"
          if [[ "${AI_TOOLS_MODE,,}" == "mock" ]]; then
            echo "::error::AI_TOOLS_EXECUTION_MODE=mock is forbidden in production"
            exit 1
          fi

          if [[ -n "$AI_TOOLS_MODE" && "${AI_TOOLS_MODE,,}" != "live" ]]; then
            echo "::error::AI_TOOLS_EXECUTION_MODE must be live in production"
            exit 1
          fi

          # Generative edit tools and local resize are live even while the
          # external Aliyun matting/upscale allowlist remains empty.
          ai_tools_common_missing=0
          for key in \
            AI_TOOL_ASSET_REF_SECRET \
            RESOURCE_LIBRARY_UPLOAD_TOKEN_SECRET \
            ALIYUN_OSS_ACCESS_KEY_ID \
            ALIYUN_OSS_ACCESS_KEY_SECRET \
            ALIYUN_OSS_BUCKET \
            ALIYUN_OSS_REGION \
            ALIYUN_OSS_PUBLIC_BASE_URL; do
            if [[ -z "$(env_value "$key")" ]]; then
              echo "::error::Missing AI toolbox production key in .env.production: $key"
              ai_tools_common_missing=1
            fi
          done
          if [[ "$ai_tools_common_missing" -ne 0 ]]; then exit 1; fi

          if [[ -n "${AI_TOOLS_OPERATIONS//[[:space:],]/}" ]]; then
            ai_tools_gateway_missing=0
            for key in \
              AI_TOOLS_PROVIDER_GATEWAY_URL \
              AI_TOOLS_PROVIDER_GATEWAY_TOKEN; do
              if [[ -z "$(env_value "$key")" ]]; then
                echo "::error::Missing external AI toolbox Gateway key in .env.production: $key"
                ai_tools_gateway_missing=1
              fi
            done
            if [[ "$ai_tools_gateway_missing" -ne 0 ]]; then exit 1; fi
            echo "✓ AI toolbox external operations are enabled"
          else
            echo "✓ Aliyun matting/upscale operations are disabled; generative edit and local resize remain enabled"
          fi

          echo "✓ .env.production ready — Next.js will auto-load it during build"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Run release checks
        run: npm run check:release

      - name: Configure and verify OSS mirror rule
        run: |
          set -euo pipefail
          TRANSFER_MODE="$(node --env-file=.env.production -e 'process.stdout.write((process.env.ALIYUN_OSS_REMOTE_TRANSFER_MODE || "disabled").trim().toLowerCase())')"
          if [[ "$TRANSFER_MODE" == "mirror" ]]; then
            npm run oss:configure-mirror
            npm run oss:configure-mirror -- --check
          else
            echo "OSS mirror configuration is not required for transfer mode: $TRANSFER_MODE"
          fi

      - name: Create deployment archive
        run: |
          set -euo pipefail
          mkdir -p .deploy
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.next/cache' \
            --exclude='./.deploy' \
            --exclude='./.ui-check' \
            --exclude='./node_modules' \
            --exclude='./.env.local' \
            --exclude='./.env.production' \
            --exclude='./.api-platform-test-results*.json' \
            --exclude='./.qwen-edits-test-results.json' \
            --exclude='./old-references-contact.jpg' \
            --exclude='./tmp-module-code.txt' \
            --exclude='./*.log' \
            -czf .deploy/app.tar.gz .

      - name: Upload deployment archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Uploading deployment archive, attempt ${attempt}/5..."
            if scp -P "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=60 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              .deploy/app.tar.gz \
              "$AWS_USER_NORM@$AWS_HOST_NORM:/tmp/wanxiangzy-${GITHUB_RUN_ID}.tar.gz"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done

          echo "::error::Could not upload deployment archive over SSH"
          exit 1

      - name: Ensure build tools on EC2
        run: |
          set -euo pipefail
          echo "Ensuring make/gcc are available on EC2 (idempotent)..."
          ssh -p "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=60 \
            "$AWS_USER_NORM@$AWS_HOST_NORM" \
            'set -e
             if command -v make >/dev/null 2>&1 && command -v gcc >/dev/null 2>&1 && command -v g++ >/dev/null 2>&1; then
               echo "build tools already present"
             else
               echo "installing build tools (make/gcc/g++)..."
               (sudo yum install -y make gcc gcc-c++ >/dev/null 2>&1 && echo "installed via yum") \
                 || (sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y build-essential >/dev/null 2>&1 && echo "installed via apt")
             fi
             make --version | head -1
             gcc --version | head -1
             echo "build tools ready"'

      - name: Deploy on EC2
        env:
          AWS_APP_DIR: ${{ secrets.AWS_APP_DIR }}
          AWS_APP_NAME: ${{ secrets.AWS_APP_NAME }}
          TAG_NAME: ${{ github.ref_name }}
          DEPLOY_ARCHIVE: /tmp/wanxiangzy-${{ github.run_id }}.tar.gz
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }
          REMOTE_ENV="AWS_APP_DIR=$(quote "${AWS_APP_DIR:-}") AWS_APP_NAME=$(quote "${AWS_APP_NAME:-}") TAG_NAME=$(quote "$TAG_NAME") DEPLOY_ARCHIVE=$(quote "$DEPLOY_ARCHIVE")"
          for attempt in 1 2 3 4 5; do
            echo "Starting remote deploy, attempt ${attempt}/5..."
            if ssh -p "$AWS_PORT_NORM" -i ~/.ssh/aws_deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=60 \
              -o ConnectionAttempts=3 \
              -o ServerAliveInterval=30 \
              "$AWS_USER_NORM@$AWS_HOST_NORM" \
              "$REMOTE_ENV bash -s" \
              < scripts/deploy-aws-release.sh; then
              exit 0
            fi
            sleep $((attempt * 15))
          done

          echo "::error::Could not start remote deploy over SSH"
          exit 1
